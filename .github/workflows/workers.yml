# Authoritative scheduler: GitHub Actions (this file) + Vercel Cron (00:30 UTC backup).
# Morning run: 00:30 UTC = 06:00 IST (Asia/Kolkata)
# Evening run: 12:30 UTC = 18:00 IST (Asia/Kolkata)
# Timezone reference: all schedules use UTC; IST = UTC+05:30.
name: Enterprise Workers

on:
  schedule:
    - cron: "*/30 * * * *"   # continuous: every 30 min ingestion + light pipeline
    - cron: "30 0 * * *"     # morning editorial burst: 00:30 UTC = 06:00 IST
    - cron: "30 12 * * *"    # evening editorial burst: 12:30 UTC = 18:00 IST
  workflow_dispatch:

jobs:
  newsroom-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and normalize production URL
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set GitHub secrets: PRODUCTION_URL, CRON_SECRET"
            exit 1
          fi

          case "$APP_URL" in
            https://jandarpan.news|http://jandarpan.news|https://jandarpan.news/|http://jandarpan.news/)
              echo "::warning::PRODUCTION_URL uses apex domain. Normalizing to https://www.jandarpan.news"
              echo "APP_URL=https://www.jandarpan.news" >> "$GITHUB_ENV"
              ;;
          esac

          echo "Using APP_URL=${APP_URL}"

      - name: Stage 0 - News ingestion
        continue-on-error: true
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "fetch_news" \
            "/api/fetch-news" \
            "POST" \
            "{}" \
            "300"

      - name: Stage 0b - Signal clustering
        continue-on-error: true
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "cluster" \
            "/api/cron/cluster" \
            "POST" \
            "{}" \
            "300"

      - name: Stage A - AI enrichment
        continue-on-error: true
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "ai_enrich" \
            "/api/cron/orchestrate" \
            "POST" \
            '{"workers":["ai_enrich"]}' \
            "300"

      - name: Stage B - event/job processing
        continue-on-error: true
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "cron-jobs" \
            "/api/cron/jobs" \
            "POST" \
            "{}" \
            "300"

      - name: Stage D - publication
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "publish" \
            "/api/cron/edition-publish" \
            "POST" \
            "{}" \
            "300"

      - name: Worker health check
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "workers-health" \
            "/api/cron/workers/health" \
            "GET"

      - name: Image branding audit (idempotent — safe to run every cycle)
        continue-on-error: true
        run: |
          bash .github/scripts/invoke-cron-endpoint.sh \
            "audit-branded-images" \
            "/api/admin/audit-branded-images" \
            "GET"
